name: Build and release
on:
  push:
    branches: [main]
    paths: ["echo.py"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. 1.0 (leave blank for automatic)"
        required: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyinstaller pygame
      - run: pyinstaller --windowed --name Echo echo.py
      - run: cd dist && zip -ry Echo-mac-mseries.zip Echo.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Echo-mac-mseries.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyinstaller pygame
      - run: pyinstaller --onefile --windowed --name Echo echo.py
      - run: Compress-Archive -Path dist/Echo.exe -DestinationPath dist/Echo-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Echo-windows.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: >
          gh release create "${{ inputs.version || format('1.{0}', github.run_number) }}" files/*
          --repo "${{ github.repository }}"
          --title "Echo ${{ inputs.version || format('1.{0}', github.run_number) }}"
          --notes "Windows and Apple Silicon (M-series) Mac builds. Still in development."
        env:
          GH_TOKEN: ${{ github.token }}
